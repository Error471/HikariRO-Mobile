name: Build private APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout HikariRO Mobile
        uses: actions/checkout@v4

      - name: Checkout official Winlator source
        run: git clone --recursive --depth 1 https://github.com/brunodev85/winlator.git winlator

      - name: Cross-compile patched Box64 from source
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zstd qemu-user-static

          git clone --depth 1 https://github.com/ptitSeb/box64.git /tmp/box64-src
          cd /tmp/box64-src

          # 0.24 shipped a freshly cross-compiled but otherwise-stock upstream
          # Box64 -- it ran (confirmed via qemu + on-device trace), but hit the
          # *exact* same crash as the old bundled v0.4.4: dlsym(NULL,
          # "wine_main_preload_info") returns NULL (Box64 never publishes that
          # symbol -- this is not a bug that got fixed upstream, it's simply
          # how Box64's own preloader substitute always works), so Wine's
          # ntdll falls back to a fresh NtAllocateVirtualMemory at the fixed
          # KUSER_SHARED_DATA address 0x7ffe0000 -- and that fails because it
          # lands inside Box64's own hardcoded "WINE prereserve" range
          # [0x7f000000, 0x82000000) (src/tools/wine_tools.c), which Box64
          # reserves for itself as an approximation of what wine-preloader
          # would normally reserve (per that file's own comment: "only the
          # prereserve argument is reserved, not the other zone that
          # wine-preloader reserve"). This patch shrinks that 3rd range so it
          # ends right at 0x7ffe0000 instead of 0x82000000 -- freeing exactly
          # the page ntdll needs, without touching the other two ranges.
          echo "Before patch:"
          grep -n "my_wine_reserve\[\]" src/tools/wine_tools.c
          sed -i 's/0x7f000000, 0x03000000/0x7f000000, 0x00fe0000/' src/tools/wine_tools.c
          echo "After patch:"
          grep -n "my_wine_reserve\[\]" src/tools/wine_tools.c
          if ! grep -q "0x7f000000, 0x00fe0000" src/tools/wine_tools.c; then
            echo "ERROR: wine_tools.c patch did not apply as expected" >&2
            exit 1
          fi

          # 0.25's fix above was confirmed working via a real on-device trace
          # (hikari-startup-025.log): the 0x7ffe0000 conflict is gone. Startup
          # then got further and failed differently: "wine: could not exec
          # wineserver". Box64's own trace showed it tried 5 candidate paths,
          # and even the objectively correct one -- .../opt/wine/bin/wineserver,
          # confirmed to really exist in the bundled rootfs.tzst and recognized
          # by Box64 as a valid x86_64 ELF ("IsX64=1") -- still failed with
          # "posix_spawn returned 2" (ENOENT).
          #
          # Reading Box64's own source (src/wrapped/wrappedlibc.c,
          # my_posix_spawn) explains why: to launch another x86_64 program,
          # Box64 recursively re-execs *itself*
          # (posix_spawn(box64path, [box64path, target, ...])) so the new
          # process can also translate that target. box64path is just Box64's
          # own on-disk path (core.c: ResolveFile(argv[0], ...)).
          #
          # A stock cross-compile of this binary is a normal dynamically
          # linked ELF whose recorded ELF interpreter (its PT_INTERP,
          # "Requesting program interpreter" in readelf -l) is a generic
          # build-time default (/lib/ld-linux-aarch64.so.1) that does not
          # exist anywhere on a real Android device's actual filesystem root
          # -- a plain execve() of it fails outright with ENOENT on the
          # interpreter. HikariLauncherActivity's Java code (since 0.15)
          # already works around exactly this for the *first* launch, by
          # searching the extracted rootfs for a real ld-linux-aarch64.so.1
          # and invoking Box64 explicitly through it -- but Box64's own
          # internal recursive self-relaunch for wineserver has no such
          # workaround: it is a plain, direct exec of the Box64 binary, so it
          # hits the exact same missing-interpreter problem all over again.
          # This was verified end to end in a local sandbox (a small C
          # program mirroring Box64's own resolve+posix_spawn(self) logic
          # reproduced the identical failure class, and stopped failing once
          # rebuilt with its interpreter linked directly to the real absolute
          # on-device path).
          #
          # The fix: bake that exact absolute path into Box64's own ELF
          # interpreter at link time, so *every* exec of Box64 -- the first
          # one from Java, and any later recursive one Box64 does internally
          # -- resolves correctly with no loader indirection needed. This is
          # exactly what the *original* bundled Winlator box64-0.4.4.tzst
          # asset already did for its own applicationId (readelf on it shows
          # interpreter /data/data/com.winlator/files/rootfs/lib/ld-linux-aarch64.so.1)
          # -- our own builds simply never matched that convention for our
          # own applicationId (com.hikariro.mobile) until now. RootFS.java
          # extracts to <filesDir>/rootfs, and the rootfs bundle's real ARM64
          # loader lives at usr/lib/ld-linux-aarch64.so.1 (confirmed by
          # listing the actual rootfs.tzst asset), so:
          INTERP_PATH="/data/user/0/com.hikariro.mobile/files/rootfs/usr/lib/ld-linux-aarch64.so.1"

          # -DWINLATOR_GLIBC=ON is Box64's own official build option for
          # exactly this scenario ("Set to ON if targeting an Android device
          # with Winlator Glibc") -- unrelated to the interpreter fix above,
          # but clearly the intended flag for this target and not previously
          # set by 0.24/0.25, so it is enabled now too.
          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DARM64=ON -DARM_DYNAREC=ON -DWINLATOR_GLIBC=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,--dynamic-linker=${INTERP_PATH}"
          make -j"$(nproc)"
          aarch64-linux-gnu-strip box64
          file box64

          echo "Sanity check: verify the baked-in on-device interpreter path"
          readelf -l box64 | grep -A1 "program interpreter"
          if ! readelf -l box64 | grep -q "$INTERP_PATH"; then
            echo "ERROR: box64 was not linked with the expected on-device interpreter path" >&2
            exit 1
          fi

          # Recreate the exact absolute path on the runner (the real device's
          # own filesystem root will really have this, once the app is
          # installed and its rootfs is extracted -- see RootFS.java) so this
          # check proves a *plain* exec works with no -L sysroot override and
          # no explicit loader indirection, exactly mirroring how a real,
          # unsandboxed exec (including Box64's own internal recursive one)
          # will resolve it on-device.
          sudo mkdir -p "$(dirname "$INTERP_PATH")"
          sudo cp /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 "$INTERP_PATH"
          sudo cp /usr/aarch64-linux-gnu/lib/libc.so.6 /usr/aarch64-linux-gnu/lib/libm.so.6 /usr/aarch64-linux-gnu/lib/libresolv.so.2 "$(dirname "$INTERP_PATH")/"
          echo "Sanity check: plain exec (no -L, no loader indirection) under qemu-aarch64 emulation"
          qemu-aarch64-static ./box64 --version

          # Package into the exact same tar layout Winlator's own TarCompressorUtils
          # expects (./usr/local/bin/box64). File mode in the tar doesn't actually
          # matter -- Winlator chmod's every extracted file to 0771 on extraction
          # regardless -- but 755 is set anyway to keep the archive itself sane.
          STAGE=/tmp/box64-stage
          mkdir -p "$STAGE/usr/local/bin"
          cp box64 "$STAGE/usr/local/bin/box64"
          chmod 755 "$STAGE/usr/local/bin/box64"
          cd "$STAGE"
          tar --owner=bruno --group=bruno -cf /tmp/box64-new.tar ./usr
          zstd -19 -f /tmp/box64-new.tar -o /tmp/box64-0.4.4-new.tzst

          cd "$GITHUB_WORKSPACE"
          ASSET="winlator/app/app/src/main/assets/box64/box64-0.4.4.tzst"
          echo "Replacing bundled Box64 asset:"
          ls -la "$ASSET"
          cp /tmp/box64-0.4.4-new.tzst "$ASSET"
          ls -la "$ASSET"

          # DefaultVersion.BOX64 = "0.4.4" is a hardcoded string referenced by
          # exact match elsewhere in Winlator's own Java code, so the asset
          # filename/path is kept identical -- only the binary inside changes.

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          python3 -m pip install --quiet pillow

      - name: Apply HikariRO customization
        run: python3 scripts/customize.py

      - name: Apply 0.10 native loader workaround
        run: python3 scripts/patch_010.py

      - name: Apply 0.11 Android PID and background fix
        run: python3 scripts/patch_011.py

      - name: Apply 0.12 persistent diagnostics and full background
        run: python3 scripts/patch_012.py

      - name: Apply 0.13 direct Wine launch
        run: python3 scripts/patch_013.py

      - name: Apply 0.14 Wine loader and fullscreen artwork fix
        run: python3 scripts/patch_014.py

      - name: Apply 0.15 real Wine loader fix
        run: python3 scripts/patch_015.py

      - name: Apply 0.15.1 update compatibility version
        run: python3 scripts/patch_0151.py

      - name: Apply 0.16 component diagnostics and crisp background
        run: python3 scripts/patch_016.py

      - name: Apply 0.17 deep launcher diagnostics and fullscreen background
        run: python3 scripts/patch_017.py

      - name: Apply 0.18 runtime startup fix
        run: python3 scripts/patch_018_runtime.py

      - name: Apply 0.19 stock Wine launch fix
        run: python3 scripts/patch_019_stock_wine_launch.py

      - name: Apply 0.20 WINELOADERNOEXEC fix
        run: python3 scripts/patch_020_wineloadernoexec.py

      - name: Apply 0.21 WINEARCH=wow64 fix
        run: python3 scripts/patch_021_winearch_wow64.py

      - name: Apply 0.22 WINELOADER path fix
        run: python3 scripts/patch_022_wineloader_path.py

      - name: Apply 0.23 WOW64 + BOX64_MMAP32 fix
        run: python3 scripts/patch_023_wow64_box64mmap.py

      - name: Apply 0.24 Box64 rebuild version bump
        run: python3 scripts/patch_024_box64_rebuild.py

      - name: Apply 0.25 Box64 prereserve shrink version bump
        run: python3 scripts/patch_025_box64_prereserve_shrink.py

      - name: Apply 0.26 Box64 interpreter path fix version bump
        run: python3 scripts/patch_026_box64_interp_fix.py

      - name: Build ARM64 private APK
        working-directory: winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp winlator/app/app/build/outputs/apk/debug/app-debug.apk HikariRO-Mobile-0.26-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HikariRO-Mobile-0.26-beta
          path: HikariRO-Mobile-0.26-beta.apk
          if-no-files-found: error
          retention-days: 30
