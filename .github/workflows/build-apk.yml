name: Build private APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout HikariRO Mobile
        uses: actions/checkout@v4

      - name: Checkout official Winlator source
        run: git clone --recursive --depth 1 https://github.com/brunodev85/winlator.git winlator

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pre-accept Android SDK licenses
        run: |
          for dir in "$ANDROID_HOME/licenses" "$ANDROID_SDK_ROOT/licenses" /usr/local/lib/android/sdk/licenses; do
            [ -z "$dir" ] && continue
            mkdir -p "$dir"
            printf '%s\n%s\n%s\n' \
              "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
              "d56f5187479451eabf01fb78af6dfcb131a6481e" \
              "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$dir/android-sdk-license"
            echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$dir/android-sdk-preview-license"
            echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > "$dir/android-googletv-license"
            echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$dir/android-sdk-arm-dbt-license"
            echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$dir/google-gdk-license"
            echo "e9acab5b5fbb560a72cfaecce8946896ff6aab9d" > "$dir/mips-android-sysimage-license"
            echo "d975f751698a77b662f1254ddbeed3901e976f5a" > "$dir/intel-android-extra-license"
          done
        continue-on-error: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
          python3 -m pip install --quiet pillow

      - name: Apply HikariRO customization
        run: python3 scripts/customize.py

      - name: Apply 0.10 native loader workaround
        run: python3 scripts/patch_010.py

      - name: Apply 0.11 Android PID and background fix
        run: python3 scripts/patch_011.py

      - name: Apply 0.12 persistent diagnostics and full background
        run: python3 scripts/patch_012.py

      - name: Apply 0.13 direct Wine launch
        run: python3 scripts/patch_013.py

      - name: Apply 0.14 Wine loader and fullscreen artwork fix
        run: python3 scripts/patch_014.py

      - name: Apply 0.15 real Wine loader fix
        run: python3 scripts/patch_015.py

      - name: Apply 0.15.1 update compatibility version
        run: python3 scripts/patch_0151.py

      - name: Apply 0.16 component diagnostics and crisp background
        run: python3 scripts/patch_016.py

      - name: Apply 0.17 deep launcher diagnostics and fullscreen background
        run: python3 scripts/patch_017.py

      - name: Apply 0.18 runtime startup fix
        run: python3 scripts/patch_018_runtime.py

      - name: Build ARM64 private APK
        working-directory: winlator/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp winlator/app/app/build/outputs/apk/debug/app-debug.apk HikariRO-Mobile-0.18-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HikariRO-Mobile-0.18-beta
          path: HikariRO-Mobile-0.18-beta.apk
          if-no-files-found: error
          retention-days: 30
